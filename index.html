<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台股強弱榜 & 齊漲齊跌看板</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151924;
      --text-main: #f0f3f6;
      --text-sub: #8b949e;
      --up-color: #ff4d4f;   
      --down-color: #00e676; 
      --up-bg: rgba(255, 77, 79, 0.15);
      --down-bg: rgba(0, 230, 118, 0.15);
      --border: #21262d;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px 12px 40px 12px; -webkit-font-smoothing: antialiased; }
    
    /* 頂部導航列 */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .status-box { display: flex; align-items: center; gap: 8px; }
    .status { font-size: 11px; color: var(--text-sub); }
    .btn { background: #2f81f7; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-icon { background: transparent; border: 1px solid var(--border); padding: 6px 10px; font-size: 14px; border-radius: 8px; }
    .btn:active { transform: scale(0.95); }

    /* 類股標籤列 */
    .sector-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 4px; scroll-behavior: smooth; }
    .sector-bar::-webkit-scrollbar { display: none; }
    .tab-btn { background: transparent; color: var(--text-sub); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #2f81f7; color: #ffffff; border-color: #2f81f7; font-weight: 700; }

    /* 統計列 */
    .summary-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 12px; padding: 0 4px; }
    
    /* 單欄卡片列表 */
    .list-container { display: flex; flex-direction: column; gap: 10px; }
    
    /* 單一橫向卡片設計 */
    .card { background: var(--card-bg); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; position: relative; overflow: hidden; }
    
    .card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    
    /* 名次標籤 */
    .rank-badge { font-size: 15px; font-weight: 900; color: #4b5563; min-width: 28px; text-align: center; font-style: italic; }
    .rank-1 { color: #fbbf24; font-size: 18px; } /* 金 */
    .rank-2 { color: #9ca3af; font-size: 17px; } /* 銀 */
    .rank-3 { color: #b45309; font-size: 16px; } /* 銅 */

    /* 資訊區塊 */
    .info-box { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .s-name, .name { font-size: 16px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-stat, .symbol { font-size: 11px; color: var(--text-sub); }
    
    /* 齊漲齊跌標籤 */
    .co-movement { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
    .co-up { color: var(--up-color); background: var(--up-bg); border: 1px solid rgba(255, 77, 79, 0.3); }
    .co-down { color: var(--down-color); background: var(--down-bg); border: 1px solid rgba(0, 230, 118, 0.3); }
    .co-flat { color: var(--text-sub); background: rgba(255,255,255,0.05); }

    /* 價格與漲跌幅 (右側) */
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .price, .s-pct { font-size: 18px; font-weight: 800; }
    .change-pill { font-size: 12px; font-weight: 700; padding: 3px 6px; border-radius: 6px; display: inline-block; }

    /* 顏色狀態 */
    .up .price, .up .s-pct { color: var(--up-color); }
    .up .change-pill { color: var(--up-color); background: var(--up-bg); }
    .down .price, .down .s-pct { color: var(--down-color); }
    .down .change-pill { color: var(--down-color); background: var(--down-bg); }
    .equal .price, .equal .s-pct { color: var(--text-sub); }
    .equal .change-pill { color: var(--text-sub); background: rgba(255,255,255,0.05); }

    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    #error-log { color: var(--up-color); font-size: 12px; margin-top: 10px; text-align: center; }

    /* --- 設定選單 (Modal) --- */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(3px); }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #161b22; border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 90%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content h2 { margin-bottom: 20px; font-size: 18px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    
    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-size: 14px; margin-bottom: 8px; font-weight: 600; color: var(--text-sub); }
    .setting-group input, .setting-group select { width: 100%; background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 16px; outline: none; }
    
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; }
    .btn-save { background: #238636; color: #fff; }
    .btn-save:active { background: #2ea043; }
    .btn-reset { background: transparent; border: 1px solid var(--border) !important; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏆 即時排行榜</h1>
    <div class="status-box">
      <span id="last-update" class="status">載入中...</span>
      <button class="btn" onclick="fetchLiveQuotes()">刷新</button>
      <button class="btn btn-icon" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div id="sector-bar" class="sector-bar">
    <button class="tab-btn active" onclick="setSector('RANKING')">👑 強弱排行</button>
  </div>

  <div class="summary-bar">
    <span id="sector-stat">分析中...</span>
    <span id="sector-adv-dec">-</span>
  </div>

  <div id="stock-container" class="list-container"></div>
  <div id="error-log"></div>

  <!-- 設定選單 Modal -->
  <div id="settings-modal" class="modal-overlay" onclick="closeSettings(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2>⚙️ 系統設定</h2>
      
      <div class="setting-group">
        <label>自動更新頻率 (秒)</label>
        <input type="number" id="input-interval" placeholder="例如: 60" min="10">
      </div>
      
      <div class="setting-group">
        <label>顯示齊漲齊跌指標</label>
        <select id="input-comove">
          <option value="true">開啟 (顯示)</option>
          <option value="false">關閉 (隱藏)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-reset" onclick="resetSettings()">恢復預設</button>
        <button class="btn-save" onclick="saveSettings()">💾 儲存</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 👇 1. 替換成你的 Firebase 資料庫網址 👇
    const FIREBASE_URL = "https://stonk-aae09-default-rtdb.asia-southeast1.firebasedatabase.app";

    // 👇 2. 替換成你的 Google Cloud Function 網址 👇
    const GCF_URL = "https://tw-stock-quotes-955770872872.asia-east1.run.app";
    // ==========================================

    // 預設設定值
    const DEFAULT_SETTINGS = {
      refreshInterval: 60,
      showCoMovement: true
    };
    
    let userSettings = { ...DEFAULT_SETTINGS };
    let allStocksList = {};
    let latestQuotes = {};
    let sectorStats = {}; 
    let currentSector = 'RANKING'; 
    let autoRefreshTimer = null;

    const parsePrice = (val) => {
      if (!val || val === '-') return NaN;
      return parseFloat(val.toString().replace(/,/g, ''));
    };

    async function init() {
      try {
        // 並行讀取名單與設定檔，加速啟動
        const [listResp, settingsResp] = await Promise.all([
          fetch(`${FIREBASE_URL}/stock_list.json`),
          fetch(`${FIREBASE_URL}/settings.json`)
        ]);

        const listData = await listResp.json();
        const settingsData = await settingsResp.json();
        
        if (!listData || !listData.stocks) throw new Error("Firebase 無股票名單");
        allStocksList = listData.stocks;
        
        // 套用雲端設定
        if (settingsData) userSettings = { ...DEFAULT_SETTINGS, ...settingsData };
        
        renderSectors();
        renderCards(); 

        await fetchLiveQuotes();
        startAutoRefresh();

      } catch (e) {
        showError(e.message);
      }
    }

    // --- 設定選單邏輯 ---
    function openSettings() {
      // 開啟時載入目前設定值
      document.getElementById('input-interval').value = userSettings.refreshInterval;
      document.getElementById('input-comove').value = userSettings.showCoMovement.toString();
      document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettings(e) {
      document.getElementById('settings-modal').classList.remove('active');
    }

    async function saveSettings() {
      const interval = parseInt(document.getElementById('input-interval').value) || 60;
      const coMove = document.getElementById('input-comove').value === 'true';
      
      userSettings = { refreshInterval: interval < 10 ? 10 : interval, showCoMovement: coMove };
      
      try {
        // 存回 Firebase (需確認 Rules 允許 .write)
        await fetch(`${FIREBASE_URL}/settings.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userSettings)
        });
      } catch(e) {
        console.log("寫入 Firebase 設定失敗", e);
      }

      document.getElementById('settings-modal').classList.remove('active');
      startAutoRefresh(); // 重新套用計時器
      renderCards(); // 重新渲染畫面以套用「齊漲齊跌」顯示設定
    }

    async function resetSettings() {
      userSettings = { ...DEFAULT_SETTINGS };
      document.getElementById('input-interval').value = userSettings.refreshInterval;
      document.getElementById('input-comove').value = userSettings.showCoMovement.toString();
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (!document.hidden) fetchLiveQuotes();
      }, userSettings.refreshInterval * 1000);
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchLiveQuotes();
    });

    function showError(msg) {
      document.getElementById('last-update').innerText = "發生錯誤";
      document.getElementById('error-log').innerText = msg;
    }

    function setSector(sec) {
      currentSector = sec;
      renderSectors(); 
      renderCards();
    }

    async function fetchLiveQuotes() {
      const statusEl = document.getElementById('last-update');
      document.getElementById('error-log').innerText = ''; 
      statusEl.innerText = "抓取中...";
      
      const codes = Object.keys(allStocksList);
      if (codes.length === 0) return;

      const chunks = [];
      for (let i = 0; i < codes.length; i += 40) {
        const sliceCodes = codes.slice(i, i + 40);
        chunks.push(sliceCodes.map(c => `${allStocksList[c].market || 'tse'}_${c}.tw`).join('|'));
      }

      try {
        const promises = chunks.map(async (chunk) => {
          const res = await fetch(`${GCF_URL}?ex_ch=${encodeURIComponent(chunk)}`);
          if (!res.ok) throw new Error(`${res.status}`);
          return res.json();
        });

        const results = await Promise.all(promises);

        results.forEach(data => {
          if (!data || !data.msgArray) return;
          data.msgArray.forEach(item => {
            const prev = parsePrice(item.y);
            let rawPrice = (item.z && item.z !== '-') ? item.z : (item.pz && item.pz !== '-') ? item.pz : item.y;
            const price = parsePrice(rawPrice);

            if (!isNaN(price) && !isNaN(prev) && prev > 0) {
              latestQuotes[item.c] = { price: price, prev: prev };
            }
          });
        });

        calculateSectorStats(); 
        renderSectors();        
        renderCards();          

        const now = new Date();
        statusEl.innerText = `${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
      } catch (e) {
        showError(`失敗: ${e.message}`);
      }
    }

    function calculateSectorStats() {
      sectorStats = {};
      Object.keys(allStocksList).forEach(code => {
        const stock = allStocksList[code];
        const quote = latestQuotes[code];
        if (!quote) return;
        
        const diff = quote.price - quote.prev;
        const pct = (diff / quote.prev) * 100;

        (stock.sectors || []).forEach(sec => {
          if (!sectorStats[sec]) {
            sectorStats[sec] = { sumPct: 0, count: 0, up: 0, down: 0 };
          }
          sectorStats[sec].sumPct += pct;
          sectorStats[sec].count++;
          if (diff > 0.0001) sectorStats[sec].up++;
          else if (diff < -0.0001) sectorStats[sec].down++;
        });
      });

      Object.keys(sectorStats).forEach(sec => {
        sectorStats[sec].avgPct = sectorStats[sec].sumPct / sectorStats[sec].count;
      });
    }

    function renderSectors() {
      const bar = document.getElementById('sector-bar');
      bar.innerHTML = `<button class="tab-btn ${currentSector === 'RANKING' ? 'active' : ''}" onclick="setSector('RANKING')">👑 強弱排行</button>`;
      
      const sortedSectors = Object.keys(sectorStats).sort((a, b) => sectorStats[b].avgPct - sectorStats[a].avgPct);
      
      if (sortedSectors.length === 0) {
        const tempSectors = new Set();
        Object.values(allStocksList).forEach(s => {
          if (s.sectors) s.sectors.forEach(sec => tempSectors.add(sec));
        });
        tempSectors.forEach(sec => {
          bar.innerHTML += `<button class="tab-btn ${currentSector === sec ? 'active' : ''}" onclick="setSector('${sec}')">${sec}</button>`;
        });
        return;
      }

      sortedSectors.forEach(sec => {
        const avg = sectorStats[sec].avgPct;
        const sign = avg > 0 ? '+' : '';
        const btnText = `${sec} ${sign}${avg.toFixed(1)}%`;
        bar.innerHTML += `<button class="tab-btn ${currentSector === sec ? 'active' : ''}" onclick="setSector('${sec}')">${btnText}</button>`;
      });
    }

    function renderCards() {
      const container = document.getElementById('stock-container');
      container.innerHTML = '';

      if (currentSector === 'RANKING') renderRankingBoard(container);
      else renderStockList(container);
    }

    // 【單欄渲染：類股強弱】
    function renderRankingBoard(container) {
      document.querySelector('.header h1').innerText = "🏆 即時排行榜";
      const sortedSectors = Object.keys(sectorStats).sort((a, b) => sectorStats[b].avgPct - sectorStats[a].avgPct);
      
      if (sortedSectors.length === 0) return;

      let totalUp = 0, totalDown = 0;

      sortedSectors.forEach((sec, index) => {
        const stat = sectorStats[sec];
        totalUp += stat.up;
        totalDown += stat.down;
        
        let stateClass = 'equal', sign = '';
        if (stat.avgPct > 0.01) { stateClass = 'up'; sign = '+'; }
        else if (stat.avgPct < -0.01) { stateClass = 'down'; }

        // 計算齊漲齊跌火力
        let coHtml = '';
        if (userSettings.showCoMovement && stat.count > 0) {
          const upRate = Math.round((stat.up / stat.count) * 100);
          const downRate = Math.round((stat.down / stat.count) * 100);
          if (upRate >= 50) coHtml = `<span class="co-movement co-up">🔥 齊漲率 ${upRate}%</span>`;
          else if (downRate >= 50) coHtml = `<span class="co-movement co-down">🧊 齊跌率 ${downRate}%</span>`;
          else coHtml = `<span class="co-movement co-flat">波動分散</span>`;
        }

        const rankClass = index < 3 ? `rank-${index + 1}` : '';

        const card = document.createElement('div');
        card.className = `card ${stateClass}`;
        card.onclick = () => setSector(sec);
        
        card.innerHTML = `
          <div class="card-left">
            <div class="rank-badge ${rankClass}">#${index + 1}</div>
            <div class="info-box">
              <div class="s-name">${sec}</div>
              <div class="s-stat">漲 ${stat.up} / 跌 ${stat.down} / 平 ${stat.count - stat.up - stat.down}</div>
              ${coHtml}
            </div>
          </div>
          <div class="card-right">
            <div class="s-pct">${sign}${stat.avgPct.toFixed(2)}%</div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('sector-stat').innerText = `共 ${sortedSectors.length} 個族群`;
      document.getElementById('sector-adv-dec').innerHTML = `<span style="color:var(--up-color);">▲ ${totalUp}</span> / <span style="color:var(--down-color);">▼ ${totalDown}</span>`;
    }

    // 【單欄渲染：個股清單】
    function renderStockList(container) {
      document.querySelector('.header h1').innerText = `🔥 ${currentSector}`;
      let targetCodes = Object.keys(allStocksList).filter(code => (allStocksList[code].sectors || []).includes(currentSector));

      targetCodes.sort((a, b) => {
        const qA = latestQuotes[a], qB = latestQuotes[b];
        const pctA = qA ? (qA.price - qA.prev) / qA.prev : -999;
        const pctB = qB ? (qB.price - qB.prev) / qB.prev : -999;
        return pctB - pctA;
      });

      let upCount = 0, downCount = 0;

      targetCodes.forEach((code, index) => {
        const stock = allStocksList[code];
        const quote = latestQuotes[code];
        const card = document.createElement('div');
        
        const rankClass = index < 3 ? `rank-${index + 1}` : '';

        if (quote) {
          const diff = quote.price - quote.prev;
          const pct = ((diff / quote.prev) * 100).toFixed(2);
          let stateClass = 'equal', sign = '';
          
          if (diff > 0.0001) { stateClass = 'up'; sign = '+'; upCount++; }
          else if (diff < -0.0001) { stateClass = 'down'; downCount++; }

          card.className = `card ${stateClass}`;
          const displayPrice = quote.price % 1 === 0 ? quote.price : quote.price.toFixed(2);

          card.innerHTML = `
            <div class="card-left">
              <div class="rank-badge ${rankClass}">#${index + 1}</div>
              <div class="info-box">
                <div class="name">${stock.name || code}</div>
                <div class="symbol">${code}</div>
              </div>
            </div>
            <div class="card-right">
              <div class="price">${displayPrice}</div>
              <div class="change-pill">${sign}${pct}%</div>
            </div>
          `;
        } else {
          card.className = 'card equal pulse';
          card.innerHTML = `
            <div class="card-left">
              <div class="rank-badge ${rankClass}">#${index + 1}</div>
              <div class="info-box"><div class="name">${stock.name || code}</div><div class="symbol">${code}</div></div>
            </div>
            <div class="card-right"><div class="price">--</div><div class="change-pill">讀取中</div></div>
          `;
        }
        container.appendChild(card);
      });

      document.getElementById('sector-stat').innerText = `共 ${targetCodes.length} 檔`;
      document.getElementById('sector-adv-dec').innerHTML = `<span style="color:var(--up-color);">▲ ${upCount}</span> / <span style="color:var(--down-color);">▼ ${downCount}</span>`;
    }

    init();
  </script>
</body>
</html>
