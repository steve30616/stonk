<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台股即時強弱看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f1117; color: #f0f3f6; padding: 12px 12px 60px 12px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #21262d; }
    .header h1 { font-size: 18px; font-weight: 700; color: #ffffff; }
    .status-box { display: flex; align-items: center; gap: 8px; }
    .status { font-size: 11px; color: #8b949e; }
    .refresh-btn { background: #1f6feb; color: #ffffff; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .refresh-btn:active { opacity: 0.8; }

    .sector-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
    .sector-bar::-webkit-scrollbar { display: none; }
    .tab-btn { background: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 5px 12px; border-radius: 14px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #387ed1; color: #ffffff; border-color: #387ed1; font-weight: 600; }

    .summary-bar { font-size: 11px; color: #8b949e; margin-bottom: 10px; display: flex; justify-content: space-between; padding: 0 2px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
    .card { background: #161b22; border-radius: 8px; padding: 8px 10px; border: 1px solid #21262d; display: flex; flex-direction: column; justify-content: space-between; min-height: 72px; }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; }
    .name { font-size: 13px; font-weight: 600; color: #f0f3f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60px; }
    .symbol { font-size: 10px; color: #8b949e; }
    .price { font-size: 16px; font-weight: 700; margin: 2px 0; }
    .change { font-size: 11px; font-weight: 600; }
    
    .up { color: #f85149; }
    .down { color: #3fb950; }
    .equal { color: #8b949e; }
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>📈 即時戰報</h1>
    <div class="status-box">
      <span id="last-update" class="status">載入名單中...</span>
      <button class="refresh-btn" onclick="fetchLiveQuotes()">⚡ 現場刷新</button>
    </div>
  </div>

  <div id="sector-bar" class="sector-bar">
    <button class="tab-btn active" onclick="filterSector('ALL')">全部</button>
  </div>

  <div class="summary-bar">
    <span id="sector-stat">共 0 檔標的</span>
    <span id="sector-adv-dec">漲 0 / 跌 0</span>
  </div>

  <div id="stock-container" class="grid"></div>

  <script>
    // 👇【請替換成你的 Firebase 資料庫網址】👇
    const FIREBASE_URL = "https://stonk-aae09-default-rtdb.asia-southeast1.firebasedatabase.app";
    
    let allStocksList = {};
    let latestQuotes = {};
    let currentSector = 'ALL';

    async function init() {
      try {
        const resp = await fetch(`${FIREBASE_URL}/stock_list.json`);
        const data = await resp.json();
        
        if (!data || !data.stocks) {
          document.getElementById('last-update').innerText = "未找到名單";
          return;
        }

        allStocksList = data.stocks;
        renderSectors(allStocksList);
        renderCards(); // 先繪製骨架卡片

        // 現場抓取即時價格
        await fetchLiveQuotes();
      } catch (e) {
        document.getElementById('last-update').innerText = "名單載入失敗";
      }
    }

    function renderSectors(stocks) {
      const sectors = new Set();
      Object.values(stocks).forEach(s => {
        if (s.sectors) s.sectors.forEach(sec => sectors.add(sec));
      });
      
      const bar = document.getElementById('sector-bar');
      bar.innerHTML = `<button class="tab-btn active" onclick="filterSector('ALL')">全部</button>`;
      sectors.forEach(sec => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.innerText = sec;
        btn.onclick = () => filterSector(sec);
        bar.appendChild(btn);
      });
    }

    function filterSector(sec) {
      currentSector = sec;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === (sec === 'ALL' ? '全部' : sec));
      });
      renderCards();
    }

    async function fetchLiveQuotes() {
      const statusEl = document.getElementById('last-update');
      statusEl.innerText = "⚡ 正在現場抓價...";
      
      const codes = Object.keys(allStocksList);
      if (codes.length === 0) return;

      // 20 檔一包
      const chunks = [];
      for (let i = 0; i < codes.length; i += 20) {
        const chunkCodes = codes.slice(i, i + 20);
        const queryStr = chunkCodes.map(c => `${allStocksList[c].market || 'tse'}_${c}.tw`).join('|');
        chunks.push(encodeURIComponent(queryStr));
      }

      try {
        // 使用公開的 allorigins CORS 代理，讓 HTML 瀏覽器可以直接抓證交所！
        const promises = chunks.map(chunk => {
          const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${chunk}&json=1&delay=0`;
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(twseUrl)}`;
          
          return fetch(proxyUrl)
            .then(r => r.json())
            .catch(() => ({ msgArray: [] }));
        });

        const results = await Promise.all(promises);
        
        results.forEach(res => {
          (res.msgArray || []).forEach(item => {
            const price = item.z;
            const prev = item.y;
            if (price && price !== '-' && prev && prev !== '-') {
              latestQuotes[item.c] = {
                price: parseFloat(price),
                prev: parseFloat(prev)
              };
            }
          });
        });

        const now = new Date();
        statusEl.innerText = `🕒 ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
      } catch (e) {
        statusEl.innerText = "現場抓取異常";
      }

      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('stock-container');
      container.innerHTML = '';

      let targetCodes = Object.keys(allStocksList);
      if (currentSector !== 'ALL') {
        targetCodes = targetCodes.filter(code => (allStocksList[code].sectors || []).includes(currentSector));
      }

      // 依當前最新漲跌幅由大到小排序
      targetCodes.sort((a, b) => {
        const qA = latestQuotes[a];
        const qB = latestQuotes[b];
        const pctA = qA ? (qA.price - qA.prev) / qA.prev : -999;
        const pctB = qB ? (qB.price - qB.prev) / qB.prev : -999;
        return pctB - pctA;
      });

      let upCount = 0;
      let downCount = 0;

      targetCodes.forEach(code => {
        const stock = allStocksList[code];
        const quote = latestQuotes[code];
        const card = document.createElement('div');
        card.className = 'card';

        if (quote) {
          const diff = quote.price - quote.prev;
          const pct = ((diff / quote.prev) * 100).toFixed(2);
          let colorClass = 'equal';
          let sign = '';
          
          if (diff > 0) { 
            colorClass = 'up'; 
            sign = '+'; 
            upCount++;
          } else if (diff < 0) { 
            colorClass = 'down'; 
            downCount++;
          }

          card.innerHTML = `
            <div class="card-top">
              <span class="name" title="${stock.name}">${stock.name || code}</span>
              <span class="symbol">${code}</span>
            </div>
            <div class="price ${colorClass}">${quote.price.toFixed(2)}</div>
            <div class="change ${colorClass}">${sign}${pct}%</div>
          `;
        } else {
          card.innerHTML = `
            <div class="card-top">
              <span class="name">${stock.name || code}</span>
              <span class="symbol">${code}</span>
            </div>
            <div class="price equal pulse">--</div>
            <div class="change equal">抓價中</div>
          `;
        }
        container.appendChild(card);
      });

      document.getElementById('sector-stat').innerText = `共 ${targetCodes.length} 檔標的`;
      document.getElementById('sector-adv-dec').innerHTML = `<span class="up">▲ ${upCount}</span> / <span class="down">▼ ${downCount}</span>`;
    }

    init();
  </script>
</body>
</html>
