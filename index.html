<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台股即時強弱看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 16px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: bold; color: #ffffff; margin: 0; }
    .status-box { display: flex; align-items: center; gap: 10px; }
    .status { font-size: 12px; color: #888; }
    .refresh-btn { background: #387ed1; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .refresh-btn:active { opacity: 0.8; }

    .sector-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
    .sector-bar::-webkit-scrollbar { display: none; }
    .tab-btn { background: #222; color: #aaa; border: 1px solid #333; padding: 8px 16px; border-radius: 16px; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #387ed1; color: #ffffff; border-color: #387ed1; font-weight: bold; }

    .summary-bar { font-size: 13px; color: #888; margin-bottom: 12px; display: flex; justify-content: space-between; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 12px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .name { font-size: 15px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
    .symbol { font-size: 12px; color: #888; }
    .price { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .change { font-size: 13px; font-weight: 500; }
    
    .up { color: #f23645; }
    .down { color: #089981; }
    .equal { color: #888; }
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>📈 即時戰報</h1>
    <div class="status-box">
      <span id="last-update" class="status">載入名單中...</span>
      <button class="refresh-btn" onclick="fetchLiveQuotes()">刷新</button>
    </div>
  </div>

  <div id="sector-bar" class="sector-bar">
    <button class="tab-btn active" onclick="filterSector('ALL')">全部</button>
  </div>

  <div class="summary-bar">
    <span id="sector-stat">共 0 檔標的</span>
    <span id="sector-adv-dec">漲 0 / 跌 0</span>
  </div>

  <div id="stock-container" class="grid"></div>

  <script>
    // 👇【1. 替換成你的 Firebase 資料庫網址】👇
    const FIREBASE_URL = "https://stonk-aae09-default-rtdb.asia-southeast1.firebasedatabase.app";

    // 👇【2. 替換成剛剛在 Google Cloud 複製的 Function URL】👇
    const GCF_URL = "https://tw-stock-quotes-955770872872.asia-east1.run.app";
    
    let allStocksList = {};
    let latestQuotes = {};
    let currentSector = 'ALL';
    let autoRefreshTimer = null;

    async function init() {
      try {
        const resp = await fetch(`${FIREBASE_URL}/stock_list.json`);
        const data = await resp.json();
        
        if (!data || !data.stocks) {
          document.getElementById('last-update').innerText = "未找到名單";
          return;
        }

        allStocksList = data.stocks;
        renderSectors(allStocksList);
        renderCards(); 

        await fetchLiveQuotes();
        startAutoRefresh();
      } catch (e) {
        document.getElementById('last-update').innerText = "名單載入失敗";
      }
    }

    // 只有在網頁開著且在前景時，才每 60 秒抓價一次
    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (!document.hidden) {
          fetchLiveQuotes();
        }
      }, 60000);
    }

    // 切回分頁時立即刷新
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        fetchLiveQuotes();
      }
    });

    function renderSectors(stocks) {
      const sectors = new Set();
      Object.values(stocks).forEach(s => {
        if (s.sectors) s.sectors.forEach(sec => sectors.add(sec));
      });
      
      const bar = document.getElementById('sector-bar');
      bar.innerHTML = `<button class="tab-btn active" onclick="filterSector('ALL')">全部</button>`;
      sectors.forEach(sec => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.innerText = sec;
        btn.onclick = () => filterSector(sec);
        bar.appendChild(btn);
      });
    }

    function filterSector(sec) {
      currentSector = sec;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === (sec === 'ALL' ? '全部' : sec));
      });
      renderCards();
    }

    async function fetchLiveQuotes() {
      const statusEl = document.getElementById('last-update');
      statusEl.innerText = "⚡ 正在現場抓價...";
      
      const codes = Object.keys(allStocksList);
      if (codes.length === 0) return;

      const queryList = codes.map(c => `${allStocksList[c].market || 'tse'}_${c}.tw`).join('|');

      try {
        const resp = await fetch(`${GCF_URL}?ex_ch=${encodeURIComponent(queryList)}`);
        const data = await resp.json();

        (data.msgArray || []).forEach(item => {
          const price = item.z;
          const prev = item.y;
          if (price && price !== '-' && prev && prev !== '-') {
            latestQuotes[item.c] = {
              price: parseFloat(price),
              prev: parseFloat(prev)
            };
          }
        });

        const now = new Date();
        statusEl.innerText = `🕒 ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
      } catch (e) {
        statusEl.innerText = "抓取異常";
      }

      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('stock-container');
      container.innerHTML = '';

      let targetCodes = Object.keys(allStocksList);
      if (currentSector !== 'ALL') {
        targetCodes = targetCodes.filter(code => (allStocksList[code].sectors || []).includes(currentSector));
      }

      targetCodes.sort((a, b) => {
        const qA = latestQuotes[a];
        const qB = latestQuotes[b];
        const pctA = qA ? (qA.price - qA.prev) / qA.prev : -999;
        const pctB = qB ? (qB.price - qB.prev) / qB.prev : -999;
        return pctB - pctA;
      });

      let upCount = 0;
      let downCount = 0;

      targetCodes.forEach(code => {
        const stock = allStocksList[code];
        const quote = latestQuotes[code];
        const card = document.createElement('div');
        card.className = 'card';

        if (quote) {
          const diff = quote.price - quote.prev;
          const pct = ((diff / quote.prev) * 100).toFixed(2);
          let colorClass = 'equal';
          let sign = '';
          
          if (diff > 0) { 
            colorClass = 'up'; 
            sign = '+'; 
            upCount++;
          } else if (diff < 0) { 
            colorClass = 'down'; 
            downCount++;
          }

          card.innerHTML = `
            <div class="card-top">
              <span class="name" title="${stock.name}">${stock.name || code}</span>
              <span class="symbol">${code}</span>
            </div>
            <div class="price ${colorClass}">${quote.price.toFixed(2)}</div>
            <div class="change ${colorClass}">${sign}${pct}%</div>
          `;
        } else {
          card.innerHTML = `
            <div class="card-top">
              <span class="name">${stock.name || code}</span>
              <span class="symbol">${code}</span>
            </div>
            <div class="price equal pulse">--</div>
            <div class="change equal">讀取中</div>
          `;
        }
        container.appendChild(card);
      });

      document.getElementById('sector-stat').innerText = `共 ${targetCodes.length} 檔標的`;
      document.getElementById('sector-adv-dec').innerHTML = `<span class="up">▲ ${upCount}</span> / <span class="down">▼ ${downCount}</span>`;
    }

    init();
  </script>
</body>
</html>
